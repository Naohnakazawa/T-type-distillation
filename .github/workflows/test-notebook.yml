name: Test T-type distillation notebook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install qiskit qiskit-aer qiskit-ibm-runtime
          python -m pip install matplotlib scipy pylatexenc
          python -m pip install jupyter nbconvert ipykernel
          python -m ipykernel install --user \
            --name qiskit-stable-211 \
            --display-name "qiskit-stable-211"

      - name: Execute notebook
        env:
          SHOTS: "1000"
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute example-T-type-distillation.ipynb \
            --output executed-notebook.ipynb \
            --ExecutePreprocessor.timeout=1800

      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-distillation-notebook
          path: executed-notebook.ipynb
          if-no-files-found: ignore
